name: Enviar resumo Focus

on:
  push:
    branches:
      - main
    paths:
      - "output/focus/focus_*.html"
  workflow_dispatch: {}

jobs:
  enviar-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Enviar e-mail do resumo Focus
        env:
          FOCUS_SMTP_USER: ${{ secrets.FOCUS_SMTP_USER }}
          FOCUS_SMTP_PASSWORD: ${{ secrets.FOCUS_SMTP_PASSWORD }}
          FOCUS_EMAIL_DEST: ${{ secrets.FOCUS_EMAIL_DEST }}
          FOCUS_EMAIL_BCC: ${{ secrets.FOCUS_EMAIL_BCC }}
        run: python src/enviar_email.py

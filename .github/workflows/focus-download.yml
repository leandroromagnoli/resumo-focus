name: Download boletim Focus

on:
  schedule:
    # Toda segunda-feira às 9h15 BRT (12h15 UTC).
    - cron: "15 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  baixar-e-extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Baixar boletim Focus
        run: python src/baixar_focus.py

      - name: Extrair texto do PDF
        run: python src/extrair_texto.py

      - name: Gerar card visual (IPCA, PIB, Câmbio, Selic)
        run: python src/gerar_card.py

      - name: Commitar arquivos baixados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/focus_*.pdf data/focus_*.txt output/focus/card_focus_*.jpg
          git diff --staged --quiet || git commit -m "Baixa boletim Focus semanal"
          git push
